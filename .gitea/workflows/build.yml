# Build and test for this fork, which is hosted on Gitea.
#
# Gitea Actions reads workflows from .gitea/workflows as well as
# .github/workflows. This one lives here so the upstream cli/cli workflows under
# .github/workflows, which assume GitHub-hosted runners and their preinstalled
# toolchain, are left alone.
#
# The build matrix cross-compiles from a single Linux runner rather than taking
# a runner per operating system. CGO is off for the whole workflow, so the
# resulting binaries are static and a macOS or Windows runner would not produce
# anything a Linux runner cannot.
#
# The matrix is deliberately short: this instance has one runner, so every job
# runs one after another and each extra entry is another full compile before
# the pipeline is green. Add targets when a second runner exists.
name: Build and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The module graph is committed through go.sum, so a build that needs to
  # change go.mod is a build that would have modified the tree.
  GOFLAGS: -mod=readonly
  CGO_ENABLED: "0"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # The build stamps the version from git describe, so the tags have to
          # be present.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./api ./cmd ./internal ./pkg ./script)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -count=1 disables Go's test result cache, so every test runs even when
      # the runner restores a warm build cache.
      - name: Test
        run: go test -count=1 ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # script/package stamps the version from git describe, so the tags have
          # to be present.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Package
        # script/package is shared with the GitHub workflow, so both hosts ship
        # archives with the same name and the same contents.
        run: script/package "${{ matrix.goos }}" "${{ matrix.goarch }}"

      # script/package already verifies each package it writes, structurally and
      # against pacman when pacman is installed. What a load check catches that the
      # structural checks do not is a package pacman refuses to parse, which is the
      # failure this packaging existed to fix.
      #
      # The runner image is not an Arch system, so pacman is usually absent and
      # this step reports that rather than pretending it checked. Where the runner
      # is Debian based it is installed, because that check is the whole point.
      - name: Verify Arch package
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          if ! command -v pacman >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -qq \
                && sudo apt-get install -y -qq pacman-package-manager \
                || true
            fi
          fi
          if ! command -v pacman >/dev/null 2>&1; then
            echo "pacman unavailable on this runner; script/package verified these packages structurally but did not load one"
            exit 0
          fi
          set -euo pipefail
          # pacman is only a reader here: -Qp and -Qlp open the package file and
          # never touch the system database, so a minimal config is enough and
          # keeps the check independent of whatever pacman.conf the runner image
          # happens to ship.
          cfg="$(mktemp)"
          printf '[options]\nArchitecture = auto\n' > "$cfg"
          for pkg in dist/*.pkg.tar.zst; do
            pacman --config "$cfg" -Qp "$pkg"
            pacman --config "$cfg" -Qlp "$pkg" \
              | grep -qE '^gm /usr/(bin/gm|share/man/man1/gm\.1)$' \
              || { echo "missing required paths in $pkg"; exit 1; }
            (cd dist && sha256sum -c "$(basename "$pkg").sha256")
          done
          rm -f "$cfg"
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: gitmip-cli_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.pkg.tar.zst
            dist/*.pkg.tar.zst.sha256
          if-no-files-found: error
