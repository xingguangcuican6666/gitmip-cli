version: 2

project_name: gitmip-cli

release:
  prerelease: auto
  draft: true # we only publish after the Windows MSI gets uploaded
  name_template: "gitmip-cli {{.Version}}"

before:
  hooks:
    - >- # The linux and windows archives package the manpages below
      {{ if eq .Runtime.Goos "windows" }}echo{{ end }} make manpages GH_VERSION={{.Version}}
    - >- # On linux the completions are used in nfpms below, but on macos they are used outside in the deployment build.
      {{ if eq .Runtime.Goos "windows" }}echo{{ end }} make completions
    - >- # We need to create the `.syso` files (per architecture) to embed Windows resources (version info)
      {{ if ne .Runtime.Goos "windows" }}echo{{ end }} pwsh '.\script\gen-winres.ps1' '{{ .Version }} ({{time "2006-01-02"}})' '{{ .Version }}' '.\script\versioninfo.template.json' '.\cmd\gm\'
builds:
  - id: macos #build:macos
    goos: [darwin]
    goarch: [amd64, arm64]
    hooks:
      pre:
        - cmd: bash ./script/licenses {{ .Os }} {{ .Arch }}
          output: true
      post:
        - cmd: ./script/sign '{{ .Path }}'
          output: true
    binary: bin/gm
    main: ./cmd/gm
    ldflags:
      - -s -w -X github.com/cli/cli/v2/internal/build.Version={{.Version}} -X github.com/cli/cli/v2/internal/build.Date={{time "2006-01-02"}}

  - id: linux #build:linux
    goos: [linux]
    goarch: ["386", arm, amd64, arm64]
    env:
      - CGO_ENABLED=0
    hooks:
      pre:
        - cmd: bash ./script/licenses {{ .Os }} {{ .Arch }}
          output: true
    binary: bin/gm
    main: ./cmd/gm
    ldflags:
      - -s -w -X github.com/cli/cli/v2/internal/build.Version={{.Version}} -X github.com/cli/cli/v2/internal/build.Date={{time "2006-01-02"}}

  - id: windows #build:windows
    goos: [windows]
    goarch: ["386", amd64, arm64]
    hooks:
      pre:
        - cmd: bash ./script/licenses {{ .Os }} {{ .Arch }}
          output: true
      post:
        - cmd: pwsh .\script\sign.ps1 '{{ .Path }}'
          output: true
    binary: bin/gm
    main: ./cmd/gm
    ldflags:
      - -s -w -X github.com/cli/cli/v2/internal/build.Version={{.Version}} -X github.com/cli/cli/v2/internal/build.Date={{time "2006-01-02"}}

archives:
  - id: linux-archive
    ids: [linux]
    name_template: "gitmip-cli_{{ .Version }}_linux_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: true
    formats: [tar.gz]
    files:
      - LICENSE
      - ./share/man/man1/gm*.1
  - id: macos-archive
    ids: [macos]
    name_template: "gitmip-cli_{{ .Version }}_macOS_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: true
    formats: [zip]
    files:
      - LICENSE
      - ./share/man/man1/gm*.1
  - id: windows-archive
    ids: [windows]
    name_template: "gitmip-cli_{{ .Version }}_windows_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    wrap_in_directory: false
    formats: [zip]
    files:
      - LICENSE

nfpms: #build:linux
  - ids: [linux]
    license: MIT
    maintainer: gitmip-cli
    homepage: https://github.com/xingguangcuican6666/gitmip-cli
    bindir: /usr
    dependencies:
      - git
    description: Command line tool for GitHub and Gitea, forked from GitHub CLI.
    formats:
      - deb
      - rpm
    contents:
      - src: "./share/man/man1/gm*.1"
        dst: "/usr/share/man/man1"
      - src: "./share/bash-completion/completions/gm"
        dst: "/usr/share/bash-completion/completions/gm"
      - src: "./share/fish/vendor_completions.d/gm.fish"
        dst: "/usr/share/fish/vendor_completions.d/gm.fish"
      - src: "./share/zsh/site-functions/_gm"
        dst: "/usr/share/zsh/site-functions/_gm"
      # Debian/Ubuntu zsh does not look in /usr/share/zsh/site-functions by default,
      # so we also install to vendor-completions. See https://github.com/cli/cli/issues/13166
      - src: "./share/zsh/vendor-completions/_gm"
        dst: "/usr/share/zsh/vendor-completions/_gm"
        packager: deb
