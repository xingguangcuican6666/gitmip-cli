# Build and package this fork's release archives on GitHub-hosted runners.
#
# The unit-test workflow (go.yml) already proves the tree compiles on three
# operating systems. This workflow does the other job: it produces the
# distributable tarballs, named gitmip-cli_<version>_<os>_<arch>, that a release
# would attach.
#
# Everything cross-compiles from one Linux runner because CGO_ENABLED is off for
# the whole build, so a macOS or Windows runner would produce nothing a Linux
# runner cannot. That keeps the matrix to one job per target instead of one
# runner image per target, and every entry shares a warm Go build cache.
#
# The archives themselves are produced by script/package, the same script the
# Gitea workflow calls, so the two hosts cannot drift apart on what a package
# contains or what it is called.
#
# This is not the upstream release pipeline in deployment.yml, which signs and
# notarizes assets and needs credentials this fork does not have.
name: Package

on:
  push:
    branches:
      - trunk
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the archives, for example v1.2.3. Defaults to the latest tag."
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # script/package stamps the version from `git describe --tags`, which
          # needs the tag objects to be present.
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key-prefix: go-package

      - name: Download dependencies
        run: go mod download

      - name: Package
        run: script/package "${{ matrix.goos }}" "${{ matrix.goarch }}" "${{ inputs.version }}"

      # The archive is verified rather than assumed: a package step that produced
      # an empty or foreign-architecture tarball would otherwise upload as success.
      - name: Verify archive
        run: |
          set -euo pipefail
          archive=$(ls dist/gitmip-cli_*_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz)
          (cd dist && sha256sum -c "$(basename "$archive").sha256")
          tar -tzf "$archive" > /tmp/contents
          grep -q "/gm\(\.exe\)\?$" /tmp/contents || { echo "no gm binary in $archive"; exit 1; }
          grep -q "/LICENSE$" /tmp/contents || { echo "no LICENSE in $archive"; exit 1; }
          grep -q "/share/man/man1/gm.1$" /tmp/contents || { echo "no man pages in $archive"; exit 1; }
          echo "verified $archive ($(wc -l < /tmp/contents) entries)"

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitmip-cli_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # Collects every target's archive under one artifact, so a release only has to
  # download a single name instead of seven.
  release-bundle:
    name: Bundle all archives
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gitmip-cli_*
          merge-multiple: true
          path: dist

      - name: Write combined checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f *.sha256
          sha256sum *.tar.gz > gitmip-cli_checksums.txt
          cat gitmip-cli_checksums.txt

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitmip-cli-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
