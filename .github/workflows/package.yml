# Build and package this fork's release archives on GitHub-hosted runners.
#
# The unit-test workflow (go.yml) already proves the tree compiles on three
# operating systems. This workflow does the other job: it produces the
# distributable tarballs, named gitmip-cli_<version>_<os>_<arch>, that a release
# would attach.
#
# Everything cross-compiles from one Linux runner because CGO_ENABLED is off for
# the whole build, so a macOS or Windows runner would produce nothing a Linux
# runner cannot. That keeps the matrix to one job per target instead of one
# runner image per target, and every entry shares a warm Go build cache.
#
# The archives themselves are produced by script/package, the same script the
# Gitea workflow calls, so the two hosts cannot drift apart on what a package
# contains or what it is called.
#
# This is not the upstream release pipeline in deployment.yml, which signs and
# notarizes assets and needs credentials this fork does not have.
name: Package

on:
  push:
    branches:
      - trunk
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the archives, for example v1.2.3. Defaults to the latest tag."
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # script/package stamps the version from `git describe --tags`, which
          # needs the tag objects to be present.
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key-prefix: go-package

      - name: Download dependencies
        run: go mod download

      - name: Package
        run: script/package "${{ matrix.goos }}" "${{ matrix.goarch }}" "${{ inputs.version }}"

      # script/package verifies what it wrote and exits non-zero otherwise, but it
      # only asks pacman about the Arch package when pacman is installed. The
      # runner image is not Arch, so install pacman as a reader here and let it
      # decide whether these are packages or tarballs with a confusing name. A
      # plain tarball parses fine with tar and is rejected by pacman, which is
      # exactly the failure this step exists to catch.
      - name: Verify Arch package
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          if ! sudo apt-get update -qq \
            || ! sudo apt-get install -y -qq pacman-package-manager; then
            # The packaging is not at fault when a reader tool cannot be
            # installed, so this is a warning rather than a failure, but it stays
            # visible in the run instead of passing quietly.
            echo "::warning title=Arch package load check skipped::pacman-package-manager could not be installed on $ImageOS; only the structural checks in script/package ran"
            exit 0
          fi
          set -euo pipefail
          # pacman is only a reader here: -Qp and -Qlp open the package file and
          # never touch the system database, so a minimal config is enough and
          # keeps the check independent of whatever pacman.conf the runner image
          # happens to ship.
          cfg="$(mktemp)"
          printf '[options]\nArchitecture = auto\n' > "$cfg"
          for pkg in dist/*.pkg.tar.zst; do
            pacman --config "$cfg" -Qp "$pkg"
            pacman --config "$cfg" -Qlp "$pkg" \
              | grep -qE '^gm /usr/(bin/gm|share/man/man1/gm\.1)$' \
              || { echo "missing required paths in $pkg"; exit 1; }
            (cd dist && sha256sum -c "$(basename "$pkg").sha256")
          done
          rm -f "$cfg"
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitmip-cli_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.pkg.tar.zst
            dist/*.pkg.tar.zst.sha256
          if-no-files-found: error
          retention-days: 7

  # Collects every target's archive under one artifact, so a release only has to
  # download a single name instead of seven.
  release-bundle:
    name: Bundle all archives
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gitmip-cli_*
          merge-multiple: true
          path: dist

      - name: Write combined checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f *.sha256
          sha256sum *.tar.gz *.pkg.tar.zst > gitmip-cli_checksums.txt
          cat gitmip-cli_checksums.txt

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitmip-cli-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
